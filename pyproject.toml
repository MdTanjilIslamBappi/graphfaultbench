[project]
name = "gemma-research"
version = "0.1.0"
description = "Shared evaluation framework for Gemma 4 Developer Agent Paper Track candidates (GraphFaultBench / PatchProof / HarnessTruth feasibility study)"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.12",
    "llama-cpp-python>=0.3.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["manifests/repo_cache"]

[[tool.uv.index]]
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
