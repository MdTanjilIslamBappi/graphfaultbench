# Repository-level holdout, pre-registered 2026-10-22 (docs/HOLDOUT_PREREGISTRATION.md).
repos:
  - "django/django"
seeds: [1]
severities: [0.0, 0.5, 0.75]
corruption_operators: ["missing_edges", "high_centrality_edges", "stale_symbol_refs", "stale_rewire"]
k_values: [1, 3, 5]
primary_metric: "hit_at_5"
dev_fraction: 0.0   # every resolved task is scored; nothing was tuned on these repositories
bootstrap_resamples: 2000
alpha: 0.05
loc_bench_parquet: "manifests/raw_data/loc_bench_v1_test.parquet"
