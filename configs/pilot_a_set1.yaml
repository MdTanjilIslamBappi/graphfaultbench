# Split-run part 1 of configs/pilot_a.yaml's 6-repo sample, run on the
# local machine while part 2 (configs/pilot_a_set2.yaml) ran in parallel
# on londonpaid — see research/decision_log.md's repo-widening entry for
# why this is split and how the two parts' raw rows are merged afterwards
# (concatenation + a single recomputed bootstrap, not two separate
# analyses). Every field below except `repos` is identical to
# configs/pilot_a.yaml.
repos:
  - "python/mypy"
  - "dask/dask"
  - "PrefectHQ/prefect"
seeds: [1, 2, 3]
severities: [0.0, 0.25, 0.5, 0.75]  # 0.0 = healthy control, no corruption
corruption_operators: ["missing_edges", "high_centrality_edges", "stale_symbol_refs"]
k_values: [1, 3, 5]
primary_metric: "hit_at_5"
dev_fraction: 0.2
bootstrap_resamples: 2000
alpha: 0.05
loc_bench_parquet: "manifests/raw_data/loc_bench_v1_test.parquet"
