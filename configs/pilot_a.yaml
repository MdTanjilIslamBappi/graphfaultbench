# Real-data pilot configuration (directive §2/§7). Pre-registered before
# looking at results: primary_metric and k_values below are fixed here, not
# chosen after seeing which one looks best.
repos:
  - "python/mypy"
  - "dask/dask"
  - "PrefectHQ/prefect"
  - "numpy/numpy"
  - "scipy/scipy"
  - "aio-libs/aiohttp"
seeds: [1, 2, 3]
severities: [0.0, 0.25, 0.5, 0.75]  # 0.0 = healthy control, no corruption
corruption_operators: ["missing_edges", "high_centrality_edges", "stale_symbol_refs"]
k_values: [1, 3, 5]
primary_metric: "hit_at_5"
dev_fraction: 0.2
bootstrap_resamples: 2000
alpha: 0.05
loc_bench_parquet: "manifests/raw_data/loc_bench_v1_test.parquet"
