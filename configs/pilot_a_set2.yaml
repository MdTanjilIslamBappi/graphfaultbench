# Split-run part 2 of configs/pilot_a.yaml's 6-repo sample — the three
# new repos added for the repo-widening (research/go_no_go.md section 4
# item 3), run on londonpaid while part 1 (configs/pilot_a_set1.yaml) ran
# in parallel on the local machine. See configs/pilot_a_set1.yaml's header
# comment for the merge approach. Every field below except `repos` is
# identical to configs/pilot_a.yaml.
repos:
  - "numpy/numpy"
  - "scipy/scipy"
  - "aio-libs/aiohttp"
seeds: [1, 2, 3]
severities: [0.0, 0.25, 0.5, 0.75]  # 0.0 = healthy control, no corruption
corruption_operators: ["missing_edges", "high_centrality_edges", "stale_symbol_refs"]
k_values: [1, 3, 5]
primary_metric: "hit_at_5"
dev_fraction: 0.2
bootstrap_resamples: 2000
alpha: 0.05
loc_bench_parquet: "manifests/raw_data/loc_bench_v1_test.parquet"
